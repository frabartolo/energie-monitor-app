# 🏗️ Metric and Output Model
# Erstellt von Agent-3 (Metrik- und Output-Architekt)
# Datum: 2026-05-05

---
# Metrik-Definitionen

metriken:
  haus_gesamt:
    name: Haus-Gesamtverbrauch
    description: Gesamte Stromverbräuche des Hauses aus dem Volkszähler
    unit: kWh
    messart: cumulative_energy
    input_quellen:
      - volkszaehler_hauste
    output_kategorien:
      current_value:
        endpoint: GET /api/v1/metrics/haus_gesamt/current
        format: float
        validierung: value > 0
        fehlerbehandlung: null

      historical_timeseries:
        endpoint: GET /api/v1/metrics/haus_gesamt/timeseries?start={start}&end={end}
        format: array[{"timestamp": ISO8601, "value": float, "unit": kWh}]
        validierung:
          - "timestamp in UTC"
          - "value >= 0"
          - "unit_of_measurement: kWh"
        fehlerbehandlung:
          - "NULL-Werte bei fehlenden Daten"
          - "Log-Eintrag bei NULL-Werten"
          - "Grafana NULL-Werte anzeigen"

      daily_aggregate:
        endpoint: GET /api/v1/metrics/haus_gesamt/aggregate/daily?start={start}&end={end}
        format: array[{"date": YYYY-MM-DD, "value": float, "unit": kWh}]
        aggregatbildung:
          method: sum
          zeitraum: UTC-Kalendertage
          null_handling: "sum_only_non_null"
        validierung:
          - "date in UTC"
          - "value > 0"
          - "unit_of_measurement: kWh"

      monthly_aggregate:
        endpoint: GET /api/v1/metrics/haus_gesamt/aggregate/monthly?start={start}&end={end}
        format: array[{"month": YYYY-MM, "value": float, "unit": kWh}]
        aggregatbildung:
          method: sum
          zeitraum: UTC-Monate
          null_handling: "sum_only_non_null"
        validierung:
          - "month in UTC"
          - "value > 0"
          - "unit_of_measurement: kWh"

      yearly_aggregate:
        endpoint: GET /api/v1/metrics/haus_gesamt/aggregate/yearly?start={start}&end={end}
        format: array[{"year": YYYY, "value": float, "unit": kWh}]
        aggregatbildung:
          method: sum
          zeitraum: UTC-Jahre
          null_handling: "sum_only_non_null"
        validierung:
          - "year in UTC"
          - "value > 0"
          - "unit_of_measurement: kWh"

  pv:
