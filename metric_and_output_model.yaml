---
# Output-Verträge

output_vertraege:
  current_value:
    beschreibung: Aktueller Zählerstand in kWh
    json_format: {"metric_id": string, "timestamp": ISO8601, "value": float, "unit": kWh}
    validierung: value >= 0
    fehlerbehandlung: null

  historical_timeseries:
    beschreibung: Historische Zeitreihe mit Start- und Endzeitpunkt
    json_format: [{"timestamp": ISO8601, "value": float, "unit": kWh}]
    validierung:
      - "timestamp in UTC"
      - "value >= 0"
      - "unit_of_measurement: kWh"
    fehlerbehandlung:
      - "NULL-Werte bei fehlenden Daten"
      - "Log-Eintrag bei NULL-Werten"
      - "Grafana NULL-Werte anzeigen"

  daily_aggregate:
    beschreibung: Tagesaggregate (Verbrauch pro Tag in kWh)
    json_format: [{"date": YYYY-MM-DD, "value": float, "unit": kWh}]
    validierung:
      - "date in UTC"
      - "value > 0"
      - "unit_of_measurement: kWh"
    aggregatbildung:
      method: sum
      zeitraum: UTC-Kalendertage
      null_handling: "sum_only_non_null"

  monthly_aggregate:
    beschreibung: Monatsaggregate
    json_format: [{"month": YYYY-MM, "value": float, "unit": kWh}]
    validierung:
      - "month in UTC"
      - "value > 0"
      - "unit_of_measurement: kWh"
    aggregatbildung:
      method: sum
      zeitraum: UTC-Monate
      null_handling: "sum_only_non_null"

  yearly_aggregate:
    beschreibung: Jahresaggregate
    json_format: [{"year": YYYY, "value": float, "unit": kWh}]
    validierung:
      - "year in UTC"
      - "value > 0"
      - "unit_of_measurement: kWh"
    aggregatbildung:
      method: sum
      zeitraum: UTC-Jahre
      null_handling: "sum_only_non_null"

---
# Derivation und Normalisierung

derivation_normalization:
  einheiten_normalisierung:
    volkszaehler: "kWh (kumulativ)"
    homeassistant: "kWh (kumulativ)"
    wallbox: "W (momentan)" → "kWh (bei Aggregatbildung)"

  aggregatbildung:
    daily: "sum über alle Datenpunkte des Tages (UTC-Kalendertag)"
    monthly: "sum über alle Tagesaggregate des Monats"
    yearly: "sum über alle Monatsaggregate des Jahres"

  reset_handling:
    volkszaehler:
      erkennt_reset: "Sprung > 90% des maximalen Werts"
      handling: "NULL-Wert in Zeitreihe"
      log: "Log-Eintrag für jeden Reset"
    homeassistant:
      erkennt_reset: "kein Reset (kumulative Werte)"
      handling: "keine spezielle Behandlung"
      log: "keine Reset-Logik"

---
# Validierungsregeln

validierungsregeln:
  current_value:
    - "value >= 0"
    - "unit_of_measurement: kWh"
    - "timestamp in UTC"
    - "metric_id gültig"

  historical_timeseries:
    - "timestamp in UTC"
    - "value >= 0"
    - "unit_of_measurement: kWh"
    - "timestamp aufsteigend"
    - "keine NULL-Werte außer bei fehlenden Daten"

  daily_aggregate:
    - "date in UTC (YYYY-MM-DD)"
    - "value > 0"
    - "unit_of_measurement: kWh"
    - "UTC-Kalendertage"
    - "sum_only_non_null"

  monthly_aggregate:
    - "month in UTC (YYYY-MM)"
    - "value > 0"
    - "unit_of_measurement: kWh"
    - "UTC-Monate"
    - "sum_only_non_null"

  yearly_aggregate:
    - "year in UTC (YYYY)"
    - "value > 0"
    - "unit_of_measurement: kWh"
    - "UTC-Jahre"
    - "sum_only_non_null"

---
# Zeit-Handling

zeit_handling:
  timezone: Europe/Berlin
  utc_offset: "+02:00 (Sommerzeit) / +01:00 (Winterzeit)"
  historische_daten:
    umwandlung_zeit: "auf Zeitpunkt der Ermittlung"
    timezone_erhaltung: "UTC-Kalendertage für Aggregate"
  utc_kalendertage:
    daily: "UTC-Kalendertage für Daily Aggregate"
    monthly: "UTC-Monate für Monthly Aggregate"
    yearly: "UTC-Jahre für Yearly Aggregate"
