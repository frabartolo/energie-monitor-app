---
# Zeitraumfähigkeit

zeitraumfahigkeit:
  current_value:
    beschreibung: Immer verfügbar (aktueller Wert)
    grafana_steuerung: "kein Zeitraum nötig"

  historical_timeseries:
    beschreibung: Zeitraum von Grafana steuerbar (heute, 24h, 7d, Monat, Jahr, frei)
    grafana_parameter:
      start: "ISO8601-String"
      end: "ISO8601-String"
    grafana_datasource:
      type: "JSON"
      query: "{'queryType': 'query', 'refId': 'A'}"

  daily_aggregate:
    beschreibung: Grafana steuert Zeiträume für Tagesaggregate
    grafana_parameter:
      start: "YYYY-MM-DD"
      end: "YYYY-MM-DD"
    grafana_datasource:
      type: "JSON"
      query: "{'queryType': 'query', 'refId': 'A'}"

  monthly_aggregate:
    beschreibung: Grafana steuert Zeiträume für Monatsaggregate
    grafana_parameter:
      start: "YYYY-MM"
      end: "YYYY-MM"
    grafana_datasource:
      type: "JSON"
      query: "{'queryType': 'query', 'refId': 'A'}"

  yearly_aggregate:
    beschreibung: Grafana steuert Zeiträume für Jahresaggregate
    grafana_parameter:
      start: "YYYY"
      end: "YYYY"
    grafana_datasource:
      type: "JSON"
      query: "{'queryType': 'query', 'refId': 'A'}"

---
# Konsumierbar ohne komplexe Grafana-Transformationen

konsumierbar:
  json_api_datasource:
    typ: "JSON"
    url: "http://homeassistant.local:8081"
    timeout: 30_s

  output_format:
    current_value:
      typ: "JSON"
      format: {"metric_id": string, "timestamp": ISO8601, "value": float, "unit": kWh}
    historical_timeseries:
      typ: "JSON"
      format: [{"timestamp": ISO8601, "value": float, "unit": kWh}]
    daily_aggregate:
      typ: "JSON"
      format: [{"date": YYYY-MM-DD, "value": float, "unit": kWh}]
    monthly_aggregate:
      typ: "JSON"
      format: [{"month": YYYY-MM, "value": float, "unit": kWh}]
    yearly_aggregate:
      typ: "JSON"
      format: [{"year": YYYY, "value": float, "unit": kWh}]

  grafana_visualisierung:
    current_value: "stat"
    historical_timeseries: "graph"
    daily_aggregate: "barchart"
    monthly_aggregate: "barchart"
    yearly_aggregate: "barchart"

