# 📦 Grafana Delivery Model
# Erstellt von Agent-4 (Bereitstellungsdesigner für Grafana)
# Datum: 2026-05-05

---
# Grafana-Delivery-Model für jede Metrik

grafana_delivery_model:
  haus_gesamt:
    metrik_name: haus_gesamt
    name: Haus-Gesamtverbrauch
    beschreibung: Gesamte Stromverbräuche des Hauses aus dem Volkszähler
    unit: kWh

    output_kategorien:
      current_value:
        endpoint: GET /api/v1/metrics/haus_gesamt/current
        json_format: {"metric_id": string, "timestamp": ISO8601, "value": float, "unit": kWh}
        grafana_datasource:
          type: "JSON"
          query: "{'queryType': 'query', 'refId': 'A'}"
          datasource_url: "http://homeassistant.local:8081"
          url: "http://homeassistant.local:8081/api/v1/metrics/haus_gesamt/current"
          timeout: 30_s
        visualization:
          type: "stat"
          title: "Aktueller Hausverbrauch"
          unit: "kWh"

      historical_timeseries:
        endpoint: GET /api/v1/metrics/haus_gesamt/timeseries?start={start}&end={end}
        json_format: [{"timestamp": ISO8601, "value": float, "unit": kWh}]
        grafana_datasource:
          type: "JSON"
          query: "{'queryType': 'query', 'refId': 'A'}"
          datasource_url: "http://homeassistant.local:8081"
          url: "http://homeassistant.local:8081/api/v1/metrics/haus_gesamt/timeseries?start={start}&end={end}"
          timeout: 30_s
        visualization:
          type: "graph"
          title: "Hausverbrauch Verlauf"
          unit: "kWh"
          x_axis: "timestamp"
          y_axis: "value"

      daily_aggregate:
        endpoint: GET /api/v1/metrics/haus_gesamt/aggregate/daily?start={start}&end={end}
        json_format: [{"date": YYYY-MM-DD, "value": float, "unit": kWh}]
        grafana_datasource:
          type: "JSON"
          query: "{'queryType': 'query', 'refId': 'A'}"
          datasource_url: "http://homeassistant.local:8081"
          url: "http://homeassistant.local:8081/api/v1/metrics/haus_gesamt/aggregate/daily?start={start}&end={end}"
          timeout: 30_s
        visualization:
          type: "barchart"
          title: "Täglicher Hausverbrauch"
          unit: "kWh"
          x_axis: "date"
          y_axis: "value"

      monthly_aggregate:
        endpoint: GET /api/v1/metrics/haus_gesamt/aggregate/monthly?start={start}&end={end}
        json_format: [{"month": YYYY-MM, "value": float, "unit": kWh}]
        grafana_datasource:
          type: "JSON"
          query: "{'queryType': 'query', 'refId': 'A'}"
          datasource_url: "http://homeassistant.local:8081"
          url: "http://homeassistant.local:8081/api/v1/metrics/haus_gesamt/aggregate/monthly?start={start}&end={end}"
          timeout: 30_s
        visualization:
          type: "barchart"
          title: "Monatlicher Hausverbrauch"
          unit: "kWh"
          x_axis: "month"
          y_axis: "value"

      yearly_aggregate:
        endpoint: GET /api/v1/metrics/haus_gesamt/aggregate/yearly?start={start}&end={end}
        json_format: [{"year": YYYY, "value": float, "unit": kWh}]
        grafana_datasource:
          type: "JSON"
          query: "{'queryType': 'query', 'refId': 'A'}"
          datasource_url: "http://homeassistant.local:8081"
          url: "http://homeassistant.local:8081/api/v1/metrics/haus_gesamt/aggregate/yearly?start={start}&end={end}"
          timeout: 30_s
        visualization:
          type: "barchart"
          title: "Jährlicher Hausverbrauch"
          unit: "kWh"
          x_axis: "year"
          y_axis: "value"

