# 📋 Dashboard-Konzept + priorisierte Umsetzung
# Erstellt von Agent-5 (Dashboard- und Umsetzungsplaner)
# Datum: 2026-05-05

---
# Dashboard-Konzept

dashboard_konzept:
  dashboard_1:
    name: "📊 Live/Überblick"
    beschreibung: Live-Dashboard mit aktuellen Werten und Verläufen
    zeitraum: "heute, 24h, 7d, Monat, Jahr"
    panes:
      - aktueller_verbrauch:
          typ: "stat"
          metrik: haus_gesamt
          title: "Aktueller Gesamtverbrauch"
          unit: "kWh"

      - aktueller_solarertrag:
          typ: "stat"
          metrik: pv
          title: "Aktueller Solarertrag"
          unit: "kWh"

      - waermepumpe_uebersicht:
          typ: "graph"
          metrik: waermepumpe
          title: "Wärmepumpenverbrauch (24h)"
          unit: "kWh"

      - verbrauchs_vergleich:
          typ: "graph"
          metrik: haus_gesamt vs pv
          title: "Verbrauch vs Ertrag (24h)"
          unit: "kWh"

      - netz_einspeisung:
          typ: "barchart"
          metrik: pv
          title: "Einspeisung (Tagesverlauf)"
          unit: "kWh"

  dashboard_2:
    name: "📈 Historische Verläufe"
    beschreibung: Historische Zeitreihen mit Filterung nach Zeiträumen
    zeitraum: "heute, 24h, 7d, Monat, Jahr, frei"
    panes:
      - haus_gesamt_verlauf:
          typ: "graph"
          metrik: haus_gesamt
          title: "Haus-Gesamtverbrauch Verlauf"
          unit: "kWh"

      - waermepumpe_verlauf:
          typ: "graph"
          metrik: waermepumpe
          title: "Wärmepumpenverbrauch Verlauf"
          unit: "kWh"

      - solarertrag_verlauf:
          typ: "graph"
          metrik: pv
          title: "Solarertrag Verlauf"
          unit: "kWh"

      - verbrauchs_trends:
          typ: "barchart"
          metrik: haus_gesamt
          title: "Verbrauchstrends (Monatlich)"
          unit: "kWh"

      - jahresverlauf:
          typ: "graph"
          metrik: haus_gesamt
          title: "Jahresverlauf (2024-2026)"
          unit: "kWh"

  dashboard_3:
    name: "📅 Aggregate (Tag/Monat/Jahr)"
    beschreibung: Aggregate mit Tages-, Monats- und Jahresauswertungen
    zeitraum: "Täglich, Wöchentlich, Monatlich, Jährlich"
    panes:
      - tagesaggregate:
          typ: "barchart"
          metrik: haus_gesamt
          title: "Täglicher Gesamtverbrauch"
          unit: "kWh"

      - monatsaggregate:
          typ: "barchart"
          metrik: haus_gesamt
          title: "Monatlicher Gesamtverbrauch"
          unit: "kWh"

      - jahresaggregate:
          typ: "barchart"
          metrik: haus_gesamt
          title: "Jährlicher Gesamtverbrauch"
          unit: "kWh"

      - waermepumpe_aggregate:
          typ: "barchart"
          metrik: waermepumpe
          title: "Wärmepumpenaggregate (Täg/Monat/Jahr)"
          unit: "kWh"

      - solar_aggregate:
          typ: "barchart"
          metrik: pv
          title: "Solaraggregate (Täg/Monat/Jahr)"
          unit: "kWh"

---
# klare Reihenfolge von Messpunkt-Validierung bis Dashboard-Bau

umsetzungs_reihenfolge:
  1. messpunkt_validierung:
     beschreibung: Validierung aller Messpunkte und Datenquellen
     schritte:
       - "Volkszähler UUIDs prüfen"
       - "Home Assistant Entity IDs bestätigen"
       - "Wärmepumpe-Sensoren validieren"
       - "E-Auto Entity ID prüfen (falls vorhanden)"
     ergebnis: "Alle Messpunkte sind validiert und bereit für die Integration"

  2. datenquellen_integration:
     beschreibung: Integration aller Datenquellen in den App-Container
     schritte:
       - "Volkszähler REST API einrichten"
       - "Home Assistant API Token konfigurieren"
       - "Wärmepumpe-Sensoren in Home Assistant hinzufügen"
     ergebnis: "Alle Datenquellen sind im App-Container integriert"

  3. metrik_berechnung:
     beschreibung: Berechnung aller Metriken (Current Value, Historical, Daily, Monthly, Yearly)
     schritte:
       - "Current Value (aktueller Zählerstand)"
       - "Historical Time Series (Zeitreihe)"
       - "Daily Aggregate (Tageswerte)"
       - "Monthly Aggregate (Monatswerte)"
       - "Yearly Aggregate (Jahreswerte)"
     ergebnis: "Alle Metriken sind bereitet und verfügbar"

  4. grafana_docker_setup:
     beschreibung: Setup des Grafana-Docker-Containers
     schritte:
       - "Docker Compose konfigurieren"
       - "Grafana Container starten"
       - "Datenquelle JSON API einrichten"
       - "Dashboard-Dateien importieren"
     ergebnis: "Grafana-Container läuft mit Dashboards"

  5. dashboard_bau:
     beschreibung: Bau der Dashboards basierend auf dem Dashboard-Konzept
     schritte:
       - "Dashboard 1: Live/Überblick"
       - "Dashboard 2: Historische Verläufe"
       - "Dashboard 3: Aggregate"
       - "Dashboard-Dateien importieren"
     ergebnis: "Alle Dashboards sind importiert und sichtbar"

  6. testing:
     beschreibung: Test aller Dashboards und Metriken
     schritte:
       - "Dashboard 1: Live/Überblick testen"
       - "Dashboard 2: Historische Verläufe testen"
       - "Dashboard 3: Aggregate testen"
       - "Datenkonsistenz prüfen"
     ergebnis: "Alle Dashboards funktionieren korrekt"

  7. deployment:
     beschreibung: Deployment der Dashboards in die Produktion
     schritte:
       - "Dashboards in Grafana importieren"
       - "Zugriffsrechte konfigurieren"
       - "Monitoring einrichten"
     ergebnis: "Alle Dashboards sind in der Produktion"

